ks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":30,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26-009","t":"Which of the following countries recently enabled Unified Payments Interface (UPI) transactions for Indian visitors through a partnership between NPCI International Payments Limited (NIPL) and ACLEDA Bank Plc, allowing payments at more than 4 million merchant outlets in June 2026?","o":["Cambodia","Vietnam","Thailand","Malaysia","Indonesia"],"a":0,"e":"Supporting note from the PDFs (June-2026-Current-Affairs.pdf): MUTUAL FUND INDUSTRY: NUVAMA RECEIVED APPROVAL TO LAUNCH ITS MUTUAL FUND BUSINESS UNDER THE SPECIALISED INVESTMENT FUND (SIF) FRAMEWORK. www.oliveboard.in JUNE 2026 CURRENT AFFAIRS INTERNATIONAL UPI Launch in Cambodia: India launched UPI payment services in Cambodia through a partnership between NPCI International Payments Limited (NIPL) and ACLEDA Bank Plc","es":"auto-note","sec":"BANK","sub":"Payments & UPI","m":"Jun","src":"June_2026.pdf","pg":30,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-010","t":"Which of the following payment systems of Cambodia has been connected with India's Unified Payments Interface (UPI) to facilitate seamless digital transactions for Indian visitors in June 2026?","o":["PromptPay","PayNow","DuitNow","NETS","KHQR"],"a":4,"e":"Supporting note from the PDFs (June_2026.pdf, p.16): The arrangement connects India's UPI network with Cambodia's national QR payment ecosystem, known as KHQR, which operates under the Bakong digital payment system","es":"auto-note","sec":"BANK","sub":"Payments & UPI","m":"Jun","src":"June_2026.pdf","pg":30,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-011","t":"As NIPL scales merchant acceptance across markets in 2026, UPI payments can be used in several destinations. Which of the following is NOT among the countries listed as having UPI merchant acceptance via NIPLs network?","o":["Maldives","France","Sri Lanka","Qatar","Singapore"],"a":0," cility. III. Banks can introduce new categories of lending solely by routing them through UPI.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.9): The Reserve Bank of India (RBI) said that pre-sanctioned credit lines offered through the Unified Payments Interface (UPI) and other payment-linked credit facilities will be subject to the same prudential norms as the underlying credit product, irrespective of the delivery mode.","es":"auto-note","sec":"BANK","sub":"Payments & UPI","m":"Jun","src":"June_2026.pdf","pg":42,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26-072","t":"Which organisation recently clarified that presanctioned credit lines offered through Unified Payments Interface (UPI) will be subject to the same prudential norms as the underlying credit facility?","o":["Securities and Exchange Board of India (SEBI)","Insurance Regulatory and Development Authority of India (IRDAI)","Reserve Bank of India (RBI)","National Payments Corporation of India (NPCI)","Ministry of Finance"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.9): The Reserve Bank of India (RBI) said that pre-sanctioned credit lines offered through the Unified Payments Interface (UPI) and other payment-linked credit facilities will be subject to the same prudential norms as the underlying credit product, irrespective of the delivery mode.","es":"auto-note","sec":"INS","sub":"Insurance","m":"Jun","src":"June_2026.pdf","pg":43,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-073","t":"The Reserve Bank of India (RBI) has proposed that banks and other regulated entities adopt a board-approved framework to manage risks arising from traditional, AI-based, and machine learning models. What is this framework known as?","o":["Artificial Intelligence Governance Framework (AIGF)","Model Risk Management Framework (MRMF)","Financial Analytics Oversight Framework (FAOF)","Digital Model Compliance Framework (DMCF)","Enterprise Risk Control Framework (ERCF)"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.9): Regulated entities will be required to put in place a board-approved model risk management framework (MRMF) covering all models, including artificial intelligence and machine learning (AI/ML) models, the Reserve Bank of India's (RBI's) draft Guidance on Regulatory Principles for Model Risk Management, released.","es":"auto-note","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":43,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-074","t":"The Reserve Bank of India (RBI) has released draft guidelines on Regulatory Principles for Model Risk Management to govern the use of AI/ML and other models by regulated entities. Which of the following statements is/are correct? I. Regulated entities must adopt a board-approved Model Risk Management Framework (MRMF) covering AI/ML models. II. The draft framework applies only to models developed internally by regulated entities. III. The RBI has proposed mandatory human oversight for AI-driven decision-making.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":3,"e":"Supporting note from the PDFs (July-2026-BFA.pdf, p.3): State Bank of India (SBI) planned to become the first bank to tap the perpetual bond market in 2026, targeting Rs. 50 billion through Basel III-compliant Additional Tier-I bonds with a five-year call option; SBI's board approved raising up to Rs. 600 billion through debt instruments in FY27.","es":"auto-note","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":43,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26-075","t":"The RBI's draft Guidance on Regulatory Principles for Model Risk Management proposes mandatory human oversight to address risks such as automation bias, over-reliance on model outputs, and decision fatigue arising from the use of whi 6.pdf","pg":46,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-091","t":"Paisabazaar and SBM Bank India have launched the SBM Paisabazaar Paisa Credit Card, a Fixed Deposit- backed secured credit card. Which of the following statements is/are correct? I. The minimum Fixed Deposit (FD) required to obtain the card is 2,000. II. The card offers up to 1.5% cashback on online spends. III. The card has a zero joining fee.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":4,"e":"(No matching note found in the supplied PDFs; answer as printed in the source.)","es":"answer-only","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":46,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26-092","t":"Which of the following AI-powered fintech platforms recently received approval from the National Payments Corporation of India (NPCI) to operate as a Third Party Application Provider (TPAP) for offering UPI services on its platform?","o":["Paytm","PhonePe","CRED","Groww","jUMPP"],"a":4,"e":"Supporting note from the PDFs (June_2026.pdf, p.16): AI-powered fintech platform jUMPP has received approval from the National Payments Corporation of India (NPCI) as a Third Party Application Provider (TPAP), allowing it to offer UPI services on its platform.","es":"auto-note","sec":"BANK","sub":"Payments & UPI","m":"Jun","src":"June_2026.pdf","pg":47,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-093","t":"Which of the following banks has partnered with the AI-powered fintech platform jUMPP to support its banking and Bharat Bill Payment System (BBPS) services after it received NPCI approval for UPI operations?","o":["HDFC Bank","ICICI Bank","YES Bank","Axis Bank","State Bank of India"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.16): The startup has partnered with YES Bank for banking and Bharat Bill Payment System (BBPS) services","es":"auto-note","sec":"BANK","sub":"Payments & ank of India (RBI)","Securities and Exchange Board of India (SEBI)","International Financial Services Centres Authority (IFSCA)","Insurance Regulatory and Development Authority of India (IRDAI)","Ministry of Finance"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.18): Lexi Money IFSC Private Limited (LEXI) has received in-principle approval from the International Financial Services Centres Authority (IFSCA) to operate as a Payment Service Provider (PSP) at GIFT-IFSC, Gandhinagar.","es":"auto-note","sec":"INS","sub":"Insurance","m":"Jun","src":"June_2026.pdf","pg":47,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-097","t":"Which of the following export targets has been set by the Government of India to be achieved by 2030, highlighting the need for stronger financial infrastructure and trade facilitation mechanisms?","o":["$1 trillion","$1.5 trillion","$2 trillion","$2.5 trillion","$3 trillion"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.18): The Government of India has set a target of $2 trillion by 2030 -- more than doubling the country's export footprint in under five years.","es":"auto-note","sec":"BANK","sub":"Economy & Indicators","m":"Jun","src":"June_2026.pdf","pg":48,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-098","t":"Which of the following financial instruments has been explicitly expanded under the Reserve Bank of Indias (RBI) final directions issued in June 2026 to deepen Indias credit derivatives market and enhance risk management tools for market participants?","o":["Foreign exchange forward contracts","Credit Default Swaps (CDS)","Treasury bills","Interest rate futures (IRF)","Commodity derivatives"],"a":1,"e":"Supporting note from the PDFs (June-2026-Current-Affairs.pdf): Credit Derivatives Framework: RBI issued final directions allowing resident non-retail users to undertake Credit Default Swaps (CDS) and Total Return Swaps (TRS) to deepen India's credit derivatives market","es":"auto-note","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":48,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-099","t":"The Reserve Bank of India (RBI) has issued final directions to expand India's credit derivatives market. Which of the following statements is/are correct? I. RBI has allowed wider use of Credit Default Swaps (CDS) and Total Return Swaps (TRS). II. Foreign Portfolio Investors (FPIs) can trade credit index futures subject to RBI safeguards. III. Resident Indian non-retail users can use CDS only for hedging purposes.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":1,"e":"Supporting note from the PDFs (June-2026-Current-Affairs.pdf): Credit Derivatives Framework: RBI issued final directions allowing resident non-retail users to undertake Credit Default Swaps (CDS) and Total Return Swaps (TRS) to deepen India's credit derivatives market","es":"auto-note","sec":"BANK","sub":"Capital Markets & SEBI","m":"Jun","src":"June_2026.pdf","pg":48,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26-100","t":"Which of the following entities was made eligible by the Reserve Bank of India (RBI) to act as a protection seller under its revised credit derivatives framework, in June 2026?","o":["Insurance companies","Primary Dealers only","Regional Rural Banks only","Payments Banks only","Small Finance Banks only"],"a":0,"e":"Supporting note from the PDFs (June_2026.pdf, p.26): Decoding FIIs, FPIs, G-Secs, BIS Foreign Institutional Investment (FII)is a category of FPI that refers specifically to investments made by foreign institutional investors such as mutual funds, pension funds, insurance companies, and hedge funds","es":"auto-note","sec":"INS","sub":"Insurance","m":"Jun","src":"June_2026.pdf","pg":48,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-101","t":"According to the Reserve Bank of India's revised framework issued in June 2026, NonBanking Financial Companies (NBFCs) with assets of at least how much will automatically be classified under the Upper Layer category?","o":["Rs. 50,000 crore","Rs. 75,000 crore","Rs. 1 lakh crore","Rs. 1.5 lakh crore","Rs. 2 lakh crore"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.11): The Reserve Bank of India (RBI) has issued a revised framework for identifying Upper Layer Non-Banking Financial Companies (NBFC-ULs), stating that NBFCs with an asset size of Rs 1 lakh crore and above will automatically be classified in the Upper Layer category.","es":"auto-note","sec":"BANK","sub":"NBFCs","m":"Jun","src":"June_2026.pdf","pg":48,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-102","t":"Which of the following categories of financial institutions will now also be considered for inclusion in the Upper Layer category under the Reserve Bank of India's revised NBFC framework in June 2026?","o":["Government-owned NBFCs","Regional Rural Banks (RRBs)","Primary Agricultural Credit Societies (PACS)","Urban Cooperative Banks (UCBs)","Small Finance Banks (SFBs)"],"a":0,"e":"Supporting note from the PDFs (June_2026.pdf, p.11): Additionally, government-owned NBFCs that meet the eligibility criteria will now be considered for inclusion in the Upper Layer category.","es":"auto-note","sec":"BANK","sub":"NBFCs","m":"Jun","src":"June_2026.pdf","pg":48,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-103","t":"According to the Reserve Bank of India's revised framework for Upper Layer NBFCs, the asset-size threshold for classification will now be reviewed at what interval in June 2026?","o":["Every 2 years","Every 3 years","Every 4 years","Every 5 years","Every 10 years"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.11): The regulator also said the threshold will now be reviewed every three years, instead of every five years as propose in the draft framework.","es":"auto-note","sec":"BANK","sub":"NBFCs","m":"Jun","src":"June_2026.pdf","pg":49,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-104","t":"According to the Reserve Bank of India (RBI), which currency accounted for the largest share of India's external debt composition at the end of March 2026?","o":["Indian Rupee","Euro","Japanese Yen","US Dollar","Special Drawing Rights (SDR)"],"a":3,"e":"Supporting note from the PDFs (June_2026.pdf, p.12): The US dollar remained the dominant currency in India's external debt composition, accounting for 55.5 per cent of the outstanding stock at the end of March","es":"auto-note","sec":"BANK","sub":"Forex & External Sector","m":"Jun","src":"June_2026.pdf","pg":49,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-105","t":"According to the Reserve Bank of India (RBI), India's external debt increased to USD 762.8 billion at the end of March 2026. Which of the following statements is/are correct? I. India's external debt stood at USD 762.8 billion at the end of March 2026. II. The US dollar accounted for the largest share of India's external debt. III. India's external debt-to-GDP ratio declined to 19.8% in FY26.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.12): India's external debt rose by $26.3 billion to $762.8 billion by March 2026 from a year earlier, while the external debt-to-GDP ratio increased to 20.8 per cent from 19.8 per cent, data released by the Reserve Bank of India (RBI).","es":"auto-note","sec":"BANK","sub":"Forex & External Sector","m":"Jun","src":"June_2026.pdf","pg":49,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26-106","t":"According to the Reserve Bank of India (RBI), India's external debt-to-GDP ratio increased to what level at the end of March 2026?","o":["18.8%","19.8%","20.8%","21.8%","22.8%"],"a":2,"e":"Supporting note from the PDFs (June-2026-Current-Affairs.pdf): India's External Debt: India's external debt increased to USD 762.8 billion at the end of March 2026, with the external debt-to-GDP ratio rising to 20.8%","es":"auto-note","sec":"BANK","sub":"Forex & External Sector","m":"Jun","src":"June_2026.pdf","pg":49,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-107","t":"According to the Reserve Bank of India (RBI), India's external debt increased during FY2025-26, reflecting the country's outstanding obligations to foreign lenders. What was the total external debt outstanding at the end of March 2026?","o":["$722.8 billion","$742.8 billion","$752.8 billion","$762.8 billion","$782.8 billion"],"a":3,"e":"Supporting note from the PDFs (June_2026.pdf, p.12): India's external debt rose by $26.3 billion to $762.8 billion by March 2026 from a year earlier, while the external debt-to-GDP ratio increased to 20.8 per cent from 19.8 per cent, data released by the Reserve Bank of India (RBI).","es":"auto-note","sec":"BANK","sub":"Forex & External Sector","m":"Jun","src":"June_2026.pdf","pg":49,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-108","t":"Under the Reserve Bank of India's Benchmark Issuance Strategy (BIS) for State Development Loans (SDLs), the inclusion of 10 additional jurisdictions has increased the total number of participating states and Union Territories to how many?","o":["15","17","19","21","23"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.12): During 2025-26, 19 states or Union Territories availed themselves of the special drawing facility, with 11 of them resorting to Ways and Means Advances (WMA) and 10 using overdrafts on a few occasions.","es":"auto-note","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":50,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-109","t":"The Reserve Bank of India (RBI) recently expanded its Benchmark Issuance Strategy (BIS) for State Development Loans (SDLs) by including how many additional jurisdictions?","o":["5","8","10","12","15"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.12): 10 more jurisdictions come under RBI's State Development Loans framework","es":"auto-note","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":50,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26-110","t":"The Reserve Bank of India (RBI) has expanded its Benchmark Issuance Strategy (BIS) framework for State Development Loans (SDLs). Which of the following statements is/are correct? I. The BIS framework was introduced to improve transparency in the State Development Loans (SDLs) market. II. The framework was first introduced with 19 states in Q1 FY27. III. The BIS framework is meant for Central Government Securities (G-Secs).","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":0,"e":"Supporting note from the PDFs (June_2026.pdf, p.12): The BIS framework, introduced on a pilot basis in the first quarter of FY27 with nine states, involves issuing state development loans (SDLs) in pre-announced benchmark maturity buckets to improve transparency and provide greater clarity to investors.","es":"auto-note","sec":"BANK","sub":"Banks & Banking Operations","m":"Jun","src":"June_2026.pdf","pg":50,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26E-001","t":"Which of the following commodities was granted a temporary exemption from all customs duties by the Central Government to improve raw material availability for the textile and apparel sector and reduce input costs from 1st June to 31st October 2026?","o":["Jute","Silk","Wool","Cotton","Hemp"],"a":3,"e":"Supporting note from the PDFs (June_2026.pdf, p.21): To augment availability of cotton for the Indian textile sector, the Central Government has temporarily exempted all customs duties on import of cotton from 1st June, 2026 till 31st October, 2026.","es":"auto-note","sec":"BANK","sub":"General","m":"Jun","src":"June_2026.pdf","pg":52,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26E-002","t":"The Central Government has temporarily exempted all customs duties on the import of cotton to support the domestic textile industry. Which of the following statements is/are correct? I. The exemption is effective from 1 June 2026 to 31 October 2026. II. The measure aims to improve cotton availability for the textile sector. III. The exemption applies to cotton imports till 31 March 2027.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.21): To augment availability of cotton for the Indian textile sector, the Central Government has temporarily exempted all customs duties on import of cotton from 1st June, 2026 till 31st October, 2026.","es":"auto-note","sec":"BANK","sub":"General","m":"Jun","src":"June_2026.pdf","pg":52,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26E-003","t":"Which of the following fuels has subjected to the highest export levy under the revised rates notified by the Central Government for the fortnight beginning June 1, 2026?","o":["Petrol","Diesel","Aviation Turbine Fuel (ATF)","Compressed Natural Gas (CNG)","Liquefied Petroleum Gas (LPG)"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.21): The Central government has revised export levies on petrol, diesel and aviation turbine fuel (ATF) for the fortnight beginning June 1.","es":"auto-note","sec":"BANK","sub":"Economy & Indicators","m":"Jun","src":"June_2026.pdf","pg":52,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26E-004","t":"For the fortnight beginning June 1, 2026, the government revised export levies. What Special Additional Excise Duty (SAED) was set on petrol exports in this review aimed at ensuring domestic availability amid global volatility?","o":["Rs 3 per litre","Rs 1.5 per litre","Rs 9.5 per litre","Rs 13.5 per litre","Rs 0 per litre"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.21): On May 16, the government revised export taxes on petroleum products, imposing a special additional excise duty (SAED) of Rs. 3 per litre on petrol exports while reducing the duty on diesel to Rs. 16.5 per litre.","es":"auto-note","sec":"BANK","sub":"Economy & Indicators","m":"Jun","src":"June_2026.pdf","pg":52,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26E-005","t":"Which of the following measures was introduced by the Central Government on March 27, 2026, to ensure domestic availability of petroleum products in the backdrop of the West Asia crisis and was subsequently revised for the fortnight beginning June 1, 2026?","o":["Import duty on crude oil (IDOC)","Special Additional Excise Duty (SAED) on petroleum product exports","Windfall tax on natural gas production","Carbon cess on refinery operations","GST on petroleum exports"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.21): On May 16, the government revised export taxes on petroleum products, imposing a special additional excise duty (SAED) of Rs. 3 per litre on petrol exports while reducing the duty on diesel to Rs. 16.5 per litre.","es":"auto-note","sec":"BANK","sub":"Economy & Indicators","m":"Jun","src":"June_2026.pdf","pg":52,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26E-006","t":"What was the total value of Indias seafood exports, which reached a record high despite global market challenges in FY 202526 as reported by the Marine Products Export Development Authority (MPEDA) in June 2026?","o":["Rs. 68,450 Crore","Rs. 70,120 Crore","Rs. 73,890 Crore","Rs. 76,500 Crore","Rs. 80,210 Crore"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.23): India exported 19,72,018 metric tonnes (MT) of seafood valued at Rs. 73,890.46 crore (USD 8.46 billion) during FY 2025- 26, registering an all-time high in both volume and value despite challenging global market conditions, said Chairman, Marine Products Export Development Authority (MPEDA), Shri P. Jawahar, IAS.","es":"auto-note","sec":"BANK","sub":"RBI & Monetary Policy","m":"Jun","src":"June_2026.pdf","pg":53,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26E-007","t":"With Indias seafood export basket diversifying in FY 2025-26, consider the following statements and identify the correct ones: I. China emerged as the largest destination for Indian seafood exports in terms of quantity, importing 4,90,369 MT worth USD 1,611.32 million. II. Exports of frozen squid in FY 202526 totalled 1,02,060 MT, earning USD 513.84 million. III. Dried seafood products ranked third among exported items by value in FY 2025-26, with earnings of Rs 5,079.09 crore.","o":["I only","I and II only","II and III only","I and III only","I, II, and III"],"a":4,"e":"(No matching note found in the supplied PDFs; answer as printed in the source.)","es":"answer-only","sec":"BANK","sub":"Economy & Indicators","m":"Jun","src":"June_2026.pdf","pg":53,"org":"O","fl":[],"ns":true,"dup":"","ex":false},{"id":"J26E-008","t":"Which of the following seafood export items emerged as the largest contributor to Indias total seafood export earnings in FY 202526, accounting for more than 66% of total US dollar export earnings as reported in June 2026?","o":["Frozen fish","Frozen shrimp","Dried seafood","Frozen squid","Live marine products"],"a":1,"e":"Supporting note from the PDFs (June_2026.pdf, p.24): Frozen shrimp remained the leading export item, contributing '49,037.93 crore (USD 5,624.48 million)","es":"auto-note","sec":"BANK","sub":"RBI & Monetary Policy","m":"Jun","src":"June_2026.pdf","pg":53,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"J26E-009","t":"The Union Cabinet approved a one-time budgetary support of up to what amount for Aviation Turbine Fuel (ATF) price stabilization support to Scheduled Indian Airlines in June 2026?","o":["Rs. 5,700 crore","Rs. 7,500 crore","Rs. 10,000 crore","Rs. 12,000 crore","Rs. 15,000 crore"],"a":2,"e":"Supporting note from the PDFs (June_2026.pdf, p.21): The Union Cabinet, chaired by Prime Minister Shri Narendra Modi, has approved a one-time budge ","es":"pdf","sec":"BANK","sub":"RBI & Monetary Policy","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":14,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-003","t":"UPI was launched in Greece through which partnership, witnessed by Commerce Minister Piyush Goyal?","o":["SBI-Piraeus Bank","Eurobank-NIPL","RBI-Bank of Greece","NPCI-Piraeus"],"a":1,"e":"NIPL (NPCI International Payments Limited) is the international arm of NPCI. The launch enables instant, secure, low-cost digital payments in Greece.","es":"pdf","sec":"BANK","sub":"Payments & UPI","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":14,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-004","t":"Which bank became the first issuer of Visa Payment Passkey in India, enabling OTP-less authentication?","o":["HDFC Bank","Kotak Mahindra Bank","IDFC FIRST Bank","Axis Bank"],"a":2,"e":"Visa Passkeys use FIDO-based public-key cryptography. The feature is available at select merchants like Myntra and Paytm.","es":"pdf","sec":"BANK","sub":"Banks & Banking Operations","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":14,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-005","t":"NPCI partnered with which two institutions to boost overseas UPI payments with real-time forex conversion?","o":["Citibank & Barclays","HSBC India & JP Morgan Payments","Standard Chartered & DBS","Deutsche Bank & UBS"],"a":1,"e":"The tie-up enables users to view the exact amount in rupees before making payments. UPI is now accepted in 9 countries for cross-border QR payments.","es":"pdf","sec":"BANK","sub":"Payments & UPI","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":15,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-006","t":"RBI imposed ₹63.6 lakh penalty on Bank of Baroda primarily for violation of which norms?","o":["Basel III norms","Priority Sector Lending","Fair Practices Code and KYC norms","CRR/SLR norms"],"a":2,"e":"The bank also charged higher interest than the contracted rate in some loan accounts. GIC Housing Finance was separately fined ₹3.1 lakh.","es":"pdf","sec":"INS","sub":"Insurance","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":15,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-007","t":"Paytm Europe Payments received a Payment Institution Licence in Luxembourg from which regulatory body?","o":["ECB","FCA","CSSF","BaFin"],"a":2,"e":"CSSF stands for Commission de Surveillance du Secteur Financier, Luxembourg's financial regulator. Paytm Europe is a wholly-owned subsidiary of One 97 Communications.","es":"pdf","sec":"BANK","sub":"Forex & External Sector","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":15,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-008","t":"RBI's Financial Inclusion Index rose to how much in FY26, up from 67 in FY25?","o":["68","70","72","75"],"a":1,"e":"RBI launched the Financial Inclusion Index in 2021. It is based on three pillars: Access, Usage, and Quality. Growth was driven mainly by higher usage of financial services.","es":"pdf","sec":"BANK","sub":"Awards, Ranks & Reports","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":15,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-009","t":"NSE launched Electronic Gold Receipts (EGRs) backed by gold stored in which type of facility?","o":["RBI-registered vaults","SEBI-accredited vaults","MOF-approved vaults","BIS-certified vaults"],"a":1,"e":"EGRs represent physical gold in dematerialised form and allow seamless conversion between physical and digital gold. They are traded on stock exchanges like other demat securities.","es":"pdf","sec":"BANK","sub":"Capital Markets & SEBI","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":15,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-010","t":"Glomo became India's first non-bank acquirer to secure Visa Principal Membership. Glomo is a regulated payment service provider at which financial hub?","o":["SEEPZ SEZ","GIFT IFSC","BKC Mumbai","Hyderabad HITECH City"],"a":1,"e":"GIFT IFSC is India's first International Financial Services Centre, located in Gandhinagar, Gujarat. Glomo can now process direct Visa card payments and cross-border merchant settlements.","es":"pdf","sec":"BANK","sub":"Payments & UPI","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":16,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-011","t":"Federal Bank received its first international issuer credit rating from S&P. What rating was assigned?","o":["BB+/Stable","BBB/Positive","BBB-/Stable","A-/Stable"],"a":2,"e":"BBB- is the lowest investment-grade long-term credit rating by S&P. S&P also assigned an A- 3 short-term rating to Federal Bank.","es":"pdf","sec":"BANK","sub":"Economy & Indicators","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":16,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-012","t":"Bank of Maharashtra launched 'FinSpark 26', a national-level hackathon focused on which domain?","o":["Agricultural Finance","Banking Cyber Risks and Fraud Prevention","Digital Currency","Green Finance"],"a":1,"e":"The hackathon is open to students and dropouts across India. Winners will compete in the grand finale at Pune with a prize pool of ₹10 lakh+. Bank of Maharashtra is headquartered in Pune.","es":"pdf","sec":"BANK","sub":"Banks & Banking Operations","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":16,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-013","t":"The government approved issuance of polymer banknotes of which denominations for field trials?","o":["₹50 & ₹100","₹10 & ₹20","₹5 & ₹10","₹100 & ₹200"],"a":1,"e":"The government approved 1 billion ₹10 & ₹20 polymer notes for field trials. India first tested polymer notes in 2012. The first country to use polymer notes was Australia in 1988.","es":"pdf","sec":"BANK","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":16,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-014","t":"SBI plans to issue India's first rupee-denominated perpetual bonds of 2026 under which Basel framework?","o":["Tier-2 capital bonds","Additional Tier-I (AT-1) bonds","Tier-3 capital bonds","Supplementary Capital bonds"],"a":1,"e":"SBI plans to issue ₹5,000 crore perpetual bonds with a 5-year call option. AT-1 bonds count as Additional Tier-I Capital Instruments under Basel III.","es":"pdf","sec":"BANK","sub":"Forex & External Sector","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":16,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-015","t":"Who was appointed as liquidator of Paytm Payments Bank by the Delhi High Court?","o":["T. Rabi Sankar","Girikumar M. Nair","S.K. Mohanty","Rajiv Rajan"],"a":1,"e":"Girikumar M. Nair is a former SBI Chief GM. The liquidation process is governed under the Banking Regulation Act, 1949, initiated after RBI cancelled Paytm Payments Bank's licence. ◆ ECONOMY","es":"pdf","sec":"BANK","sub":"Banks & Banking Operations","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":17,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-016","t":"Union Cabinet approved how much additional investment in NIIF, taking the total commitment to ₹60,000 crore?","o":["₹10,000 crore","₹20,000 crore","₹30,000 crore","₹40,000 crore"],"a":2,"e":"NIIF was established in 2015. The funds will support NIIF Infrastructure Fund II, with focus sectors being Transport, Energy, Digital Infrastructure and E-mobility.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":17,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-017","t":"IMF projected India's FY27 GDP growth at what percentage, making it among the fastest- growing major economies?","o":["5.9%","6.4%","6.8%","7.2%"],"a":1,"e":"Growth is projected to be driven by private consumption and the services sector. Global growth is projected at 3.0% in 2026. IMF is headquartered in Washington, D.C., USA.","es":"pdf","sec":"BANK","sub":"Economy & Indicators","m":"Jul", epartment of Revenue, Ministry of Finance.","es":"pdf","sec":"BANK","sub":"Awards, Ranks & Reports","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":18,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-022","t":"NSE launched India's first domestic benchmark-based natural gas futures with contract symbol NATGASIND. These futures are based on which hub price?","o":["Hazira Hub","Dahej Hub (IGX Gujarat)","Kakinada Hub","Mundra Hub"],"a":1,"e":"Approved by SEBI, these are cash-settled commodity derivatives. Indian Gas Exchange (IGX) is India's first automated national gas trading platform. NSE was established in 1992.","es":"pdf","sec":"BANK","sub":"Capital Markets & SEBI","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":18,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-023","t":"World Bank approved how much for India's rooftop solar programme PM Surya Ghar: Muft Bijli Yojana?","o":["$600 million","$750 million","$890 million","$1 billion"],"a":2,"e":"The scheme targets 1 crore (10 million) households and is expected to create 1.7 million jobs. PM Surya Ghar: Muft Bijli Yojana was launched in 2024.","es":"pdf","sec":"BANK","sub":"Banks & Banking Operations","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":18,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-024","t":"India's Q1 FY27 exports rose by what percentage to USD 232.7 billion on strong merchandise growth?","o":["8.5%","11.4%","13.2%","15.9%"],"a":1,"e":"Merchandise exports increased 15.9% to USD 129.3 billion. Imports rose 17.6% to USD 270.2 billion. Trade deficit widened to USD 37.4 billion. DGFT functions under the Ministry of Commerce & Industry. ◆ NATIONAL","es":"pdf","sec":"BANK","sub":"Economy & Indicators","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":18,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-025","t":"India's first dengue vaccine QDENGA, approved by CDSCO, was developed by which company?","o":["Serum Institute","Bharat Biotech","Takeda (Japan)","Pfizer"],"a":2,"e":"QDENGA protects against all four dengue virus serotypes. CDSCO is India's national drug regulatory authority under the Ministry of Health & Family Welfare.","es":"pdf","sec":"CA","sub":"Science & Technology","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":19,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-026","t":"Which museum, named 'Shabdalok', was inaugurated by Amit Shah as India's first immersive language museum?","o":["In Mumbai","In New Delhi","In Kolkata","In Bhopal"],"a":2,"e":"Shabdalok (Museum of Word) was developed by the National Library under the Ministry of Culture. It showcases India's 22 official languages using immersive digital technology. National Library of India is located in Kolkata.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":19,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-027","t":"India commissioned its first two geothermal wells at Puga Valley in which Union Territory?","o":["Jammu & Kashmir","Ladakh","Puducherry","Andaman Islands"],"a":1,"e":"The project was executed by ONGC Energy Centre. Two wells were drilled to a depth of 1,000 metres to support India's first 1 MW pilot geothermal power project.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":19,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-028","t":"NITI Aayog launched the Bioeconomy Roadmap 2035, targeting a USD 691 billion bioeconomy. It proposes which fund?","o":["₹25,000 crore BioTech Fund","₹50,000 crore BioEconomy Growth Fund","₹75,000 crore Green Fund","₹1 lakh crore Innovation Fund"],"a":1,"e":"The roadmap aims to create 30 million+ high-value jobs. NITI Aayog was established on 1 January 2015 to replace the Planning Commission.","es":"pdf","sec":"BANK","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":19,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-029","t":"PM Modi announced a Task Force on Examination Reforms to strengthen the NTA system. Who chairs this task force?","o":["S. Somnath","Nandan Nilekani","Tapan Deka","V. Kamakoti"],"a":1,"e":"The multidisciplinary committee also includes S. Somnath, Tapan Deka, V. Kamakoti, Anita Karwal and Amrit Lal Meena. NTA was established in 2018 under the Ministry of Education.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":19,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-030","t":"Kamarajar Port became India's second major port to offer an 18-metre draft after completing Capital Dredging Phase VI. Kamarajar Port is located in which state?","o":["Andhra Pradesh","Maharashtra","Tamil Nadu","Gujarat"],"a":2,"e":"The port can now handle Capesize vessels up to 1,70,000 DWT. Project cost was ₹440 crore. This development significantly boosts India's maritime capacity.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":20,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-031","t":"Mizoram's Natural History Museum was notified as which numbered Designated Repository under the Biological Diversity Act, 2002?","o":["18th","19th","20th","21st"],"a":3,"e":"It will preserve authenticated biological specimens and strengthens biodiversity conservation in the Indo-Burma Biodiversity Hotspot. The National Biodiversity Authority (NBA) is headquartered in Chennai.","es":"pdf","sec":"BANK","sub":"Environment","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":20,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-032","t":"The DAANVEER initiative, launched to strengthen digital infrastructure in Gram Panchayats, is available through which app?","o":["DigiGaon App","Meri Panchayat App","Grameen Digital App","E-Gram App"],"a":1,"e":"DAANVEER was launched by the Ministry of Panchayati Raj under the tagline 'Give Back to Your Village'. India has nearly 2.5 lakh Gram Panchayats.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":20,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-033","t":"Cabinet approved the National Investment Policy for Urea-2026 (NIPU-2026) to encourage new gas-based urea manufacturing. What is the introduced RoE band?","o":["8%-12%","10%-14%","12%-16%","15%-20%"],"a":2,"e":"India has 33 operational urea manufacturing units. The policy is expected to save over ₹250 crore per plant and supports Atmanirbhar Bharat.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":20,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-034","t":"MeitY launched NIDAR 2.0 under which initiative to develop drones using Indian-made chips?","o":["PLI Scheme","SwaYaan initiative","Drone Shakti","Digital India Drone Mission"],"a":1,"e":"NIDAR 2.0 has a prize pool of ₹65 lakh+ and includes incubation, internships, and startup support. MeitY stands for Ministry of Electronics and Information Technology.","es":"pdf","sec":"CA","sub":"Government Schemes","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":20,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-035","t":"India launched its campaign for a UNSC non-permanent seat for which term?","o":["2026-27","2027-28","2028-29","2029-30"],"a":2,"e":"The campaign was launched by External Affairs Minister S. Jaishankar. India will compete with Tajikistan in the Asia-Pacific Group. Elections will be held in June 2027. The UN Security Council has 15 members.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":21,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-036","t":"Sarnath was inscribed as a UNESCO World Heritage Site during which session of the World Heritage Committee, increasing India's total to 45?","o":["46th Session","47th Session","48th Session","49th Session"],"a":2,"e":"Announced at the 48th Session held in Busan, South Korea. Maratha Military Landscapes (2024) was the previous Indian inscription. Sarnath is where Lord Buddha delivered his first sermon. ◆ INTERNATIONAL","es":"pdf","sec":"CA","sub":"Summits, Agreements & India-World","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":21,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-037","t":"Which country became the first European nation to ban social media access for children below 15 years, with mandatory age verification by January 2027?","o":["Germany","Sweden","France","Netherlands"],"a":2,"e":"France has become the first European country to impose this ban, requiring platforms to prevent underage users from creating or maintaining social media accounts. Capital: Paris | Currency: Euro.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":21,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-038","t":"Pakistan will host the 2027 South Asian Federation (SAF) Games. In which city were the first-ever SAF Games held in 1984?","o":["Islamabad","Colombo","Dhaka","Kathmandu"],"a":3,"e":"SAF Games were established in 1981. SAARC Secretariat is located in Kathmandu, Nepal. The games aim to strengthen SAARC regional cooperation.","es":"pdf","sec":"CA","sub":"Sports","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":21,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-039","t":"Standard Chartered became the first bank in India to process a remittance under Swift's new retail payments scheme. The cross-border payment from Australia was completed in how many seconds?","o":["15 seconds","25 seconds","37 seconds","60 seconds"],"a":2,"e":"The transaction originated from Westpac (Australia) via the Swift network. SWIFT stands for Society for Worldwide Interbank Financial Telecommunication.","es":"pdf","sec":"BANK","sub":"Payments & UPI","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":22,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-040","t":"CAC49 adopted how many Codex standards developed under India's leadership, including a standard for cashew kernels?","o":["5","7","9","11"],"a":1,"e":"Indian delegation was led by Rajit Punhani, CEO, FSSAI. Standards adopted include dried coriander seeds and fresh curry leaves. Codex Alimentarius Commission was established by FAO and WHO in 1963.","es":"pdf","sec":"CA","sub":"Appointments","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":22,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-041","t":"Saudi Arabia and 13 other countries formed a Multinational Maritime Defence Coalition. Saudi Arabia will serve as the founding state with focus on which waterway?","o":["Strait of Hormuz only","Bab el-Mandeb Strait, Red Sea & Gulf of Aden","Suez Canal region","Persian Gulf only"],"a":1,"e":"The coalition is defensive in nature and operates under international law. Bab el-Mandeb Strait connects the Red Sea with the Gulf of Aden. ◆ SPORTS","es":"pdf","sec":"CA","sub":"Economy & Indicators","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":22,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-042","t":"Vaibhav Sooryavanshi became India's youngest international cricketer, breaking Sachin Tendulkar's record. At what age did Sooryavanshi debut?","o":["14 years 110 days","15 years 99 days","15 years 200 days","16 years 15 days"],"a":1,"e":"He debuted in the 2nd T20I vs England and received his debut cap from Tilak Varma. Sachin Tendulkar made his international debut in 1989 against Pakistan.","es":"pdf","sec":"CA","sub":"Important Days","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":22,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-043","t":"Australia won a record 7th Women's T20 World Cup title by defeating England in the final at Lord's, London. Who was the Player of the Tournament?","o":["Sophie Molineux","Ellyse Perry","Beth Mooney","Meg Lanning"],"a":2,"e":"Beth Mooney was also the Player of the Match. Sophie Molineux won the title in her first vernmental Group of Experts on Consumer Protection in Geneva. UNCTAD stands for what?","o":["United Nations Trade and Capital Development","United Nations Trade and Development","United Nations Treasury and Commercial Development","United Nations Trade and Commerce Division"],"a":1,"e":"Nidhi Khare, Secretary, Department of Consumer Affairs, chaired the session on behalf of India. UNCTAD is headquartered in Geneva, Switzerland.","es":"pdf","sec":"CA","sub":"Appointments","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":53,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-189","t":"The ICGS Akshay Fast Patrol Vessel was built by which shipyard and commissioned at Goa?","o":["Mazagon Dock","Cochin Shipyard","Goa Shipyard Limited","Garden Reach Shipbuilders"],"a":2,"e":"ICGS Akshay will support coastal security, search & rescue, and maritime law enforcement. Indian Coast Guard (ICG) was established in 1978 under the Coast Guard Act, 1978.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":53,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-190","t":"Union Cabinet approved Semicon 2.0. What does ATMP/OSAT stand for in semiconductor manufacturing?","o":["Assembly, Testing, Manufacturing and Packaging / Outsourced Semiconductor Assembly and Test","Advanced Technology Manufacturing Process / Open Source Assembly Technology","Automated Test Management Platform / Optimised Semiconductor Assembly Test","Assembly and Thermal Management Process / Outsourced Silicon Assembly Testing"],"a":0,"e":"Semicon 2.0 focuses on design, fabs, ATMP/OSAT, R&D, materials, and talent development. India Semiconductor Mission (ISM) was launched in 2021.","es":"pdf","sec":"CA","sub":"Government Schemes","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":53,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-191","t":"Which Indian cricketer retired from international cricket in July 2026, having played 85 Tests, 90 ODIs, and 20 T20Is?","o":["Cheteshwar Pujara","Rohit Sharma","Ajinkya Rahane","Shikhar Dhawan"],"a":2,"e":"Ajinkya Rahane made his international debut in 2011. His last international match was the 2nd Test vs West Indies (July 2023). He captained India to the 2020-21 Border-Gavaskar Trophy series win in Australia. BCCI is headquartered in Mumbai.","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":53,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-192","t":"India became the 4th country to use anhydrous ammonia directly in farming. The approval is under the Fertiliser (Control) Order, 1985. What is the nitrogen content in anhydrous ammonia?","o":["46%","60%","72%","82%"],"a":3,"e":"Urea contains 46% Nitrogen while Anhydrous Ammonia contains 82% Nitrogen. India aims to reduce dependence on urea imports through this move.","es":"pdf","sec":"BANK","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":54,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-193","t":"India's SDG Index 2026 rank is 94, improving from 99 in the previous year. Which city/country was at the bottom of the SDG Index 2026?","o":["Afghanistan","Sudan","Chad","Somalia"],"a":1,"e":"Sudan was at the last position (169). Finland topped the 2026 SDG Index, followed by Sweden and Denmark. The SDG Index is released by UN Sustainable Development Solutions Network.","es":"pdf","sec":"CA","sub":"Awards, Ranks & Reports","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":54,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-194","t":"Charles Leclerc's victory at the 2026 British Grand Prix was Ferrari's 250th Formula One victory. At which circuit was this race held?","o":["Circuit de Catalunya","Circuit Gilles-Villeneuve","Silverstone Circuit","Autodromo Enzo e Dino Ferrari"],"a":2,"e":"Silverstone Circuit hosts the British Grand Prix in England. It was Leclerc's 9th F1 race win. George Russell finished second while Lewis Ha ","New Zealand"],"a":2,"e":"Rahane made his debut in 2011 and played 85 Tests, 90 ODIs, and 20 T20Is. His last international match was the 2nd Test vs West Indies (July 2023).","es":"pdf","sec":"CA","sub":"General","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":55,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-199","t":"India hosted the 9th Session of UNCTAD's Intergovernmental Group of Experts (IGE) on Consumer Protection in Geneva on 6-8 July 2026. Who chaired the session on behalf of India?","o":["Apurva Chandra","Nidhi Khare","Leena Nandan","Rohit Kumar Singh"],"a":1,"e":"Nidhi Khare is the Secretary, Department of Consumer Affairs. UNCTAD (United Nations Trade and Development) is headquartered in Geneva, Switzerland.","es":"pdf","sec":"CA","sub":"Appointments","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":55,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"JCA-200","t":"India's WTO target for global merchandise exports by 2047 is what percentage, as per WTO report?","o":["5%","7%","10%","15%"],"a":2,"e":"India's current share is 1.8% (2024). The goal is aligned with the Viksit Bharat vision. Export growth will be supported through duty exemption, remission, and rebate schemes.","es":"pdf","sec":"BANK","sub":"RBI & Monetary Policy","m":"Jul","src":"July-2026-Current-Affairs.pdf","pg":55,"org":"O","fl":[],"ns":false,"dup":"","ex":false},{"id":"ACA-001","t":"The RBI deferred the final Basel III Pillar 3 disclosure guidelines to which date?","o":["September 2026","January 2027","April 2027","March 2028"],"a":2,"e":"Supporting note from the PDFs (August-Banking-and-Financial-Awareness.pdf, p.1): RBI-Basel III: The RBI deferred the final Basel III Pillar 3 disclosure guidelines by six months to 1 April 2027, and cut the mandatory website-archiving period for such reports from 10 years to at least 5 years.","es":"auto-note","sec":"BANK","sub":"General","m":"Aug","src":"August-2026-Current-Affairs.pdf","pg":6,"org":"O","fl":[],"ns":fa  crore","Rs 810.79 crore","Rs 1,013.49 crore","Rs 1,216.18 crore"],"a":1,"e":"Source note (September-2026-Current-Affairs.pdf, p.12): MoD signed a Rs 810.79 crore contract with BDL for 160 SAT-SAAW glide bombs for the IAF.","es":"note","sec":"CA","sub":"Defence","m":"Sep","src":"September-2026-Current-Affairs.pdf","pg":12,"org":"G","fl":["auto-generated-review"],"ns":true,"dup":"","ex":false},{"id":"GEN-SEP-019","t":"Fill in the blank (from notes): MY Bharat crossed ______ registered youth; it was launched on 31 October 2023.","o":["2 crore","3 crore","4 crore","6 crore"],"a":1,"e":"Source note (September-2026-Current-Affairs.pdf, p.12): MY Bharat crossed 3 crore registered youth; it was launched on 31 October 2023.","es":"note","sec":"CA","sub":"General","m":"Sep","src":"September-2026-Current-Affairs.pdf","pg":12,"org":"G","fl":["auto-generated-review"],"ns":true,"dup":"","ex":false}]</script>
<script>
"use strict";
const BANK=JSON.parse(document.getElementById('bank').textContent),BY={};BANK.forEach(q=>BY[q.id]=q);
const META={"built": "18 Oct 2026"};
const SEC={CA:'Current Affairs',INS:'Insurance Awareness',BANK:'Banking, Financial & Economic',MIX:'Mixed (Current Affairs + Insurance)',all:'All sections'};
const MON={Jun:'June 2026',Jul:'July 2026',Aug:'August 2026',Sep:'September 2026',all:'All months'};
const ORG={O:'Original PDF questions',G:'Generated questions',all:'Original + Generated'};
const LSK='niclQuizV1';let mem=null;
function fresh(){return{app:'niclQuiz',v:1,att:{},cyc:{},wrong:[],sess:[],active:null,st:{tot:{a:0,c:0},sec:{},m:{},org:{}},filt:{sec:'all',m:'all',org:'all'}}}
function load(){try{const r=localStorage.getItem(LSK);if(r)return JSON.parse(r)}catch(e){}return mem||fresh()}
let S=load();function save(){mem=S;try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const L='ABCDE';
function pool(f){return BANK.filter(q=>!q.ex&&(f.sec==='all'||(f.sec==='MIX'?q.sec!=='BANK':q.sec===f.sec))&&(f.m==='all'||q.m===f.m)&&(f.org==='all'||q.org===f.org))}
const key=f=>f.sec+'|'+f.m+'|'+f.org;
function label(f){return[SEC[f.sec],MON[f.m],ORG[f.org]].join(' · ')}
function cycle(f){const ids=pool(f).map(q=>q.id),k=key(f);let c=S.cyc[k]||(S.cyc[k]={n:1,seen:[],order:[]});const set=new Set(ids);
 c.seen=c.seen.filter(x=>set.has(x));c.order=c.order.filter(x=>set.has(x));const have=new Set(c.order);c.order=c.order.concat(shuffle(ids.filter(x=>!have.has(x))));
 const sn=new Set(c.seen);return{c,ids,rem:c.order.filter(x=>!sn.has(x))}}
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'</div>';m.classList.remove('hide')}function closeM(){$('#modal').classList.add('hide')}
function ask(msg,okl,cb){modal('<p>'+msg+'</p><div class="row"><span class="sp"></span><button onclick="closeM()">Cancel</button><button class="p" id="okb">'+okl+'</button></div>');$('#okb').onclick=()=>{closeM();cb()}}
function note(msg){modal('<p>'+msg+'</p><div class="row"><span class="sp"></span><button class="p" onclick="closeM()">OK</button></div>')}
function pct(a,b){return b?Math.round(100*a/b)+'%':'–'}
/* ---------- dashboard ---------- */
function dash(){
 const all=pool({sec:'all',m:'all',org:'all'}),O=all.filter(q=>q.org==='O').length,G=all.length-O,att=all.filter(q=>S.att[q.id]).length,cy=cycle({sec:'all',m:'all',org:'all'}),tot=S.st.tot;
 const f=S.filt;
 const opt=(o,v)=>Object.keys(o).map(k=>`<option value="${k}"${v===k?' selected':''}>${esc(o[k])}</option>`).join('');
 const rows=(items,fn)=>items.map(fn).join('');
 const prog=(label,f2,st)=>{const p=pool(f2),c=cycle(f2),a=p.filter(q=>S.att[q.id]).length;return`<tr><td>${esc(label)}</td><td>${p.length}</td><td>${a}</td><td>${c.c.seen.length}/${p.length} <small>(cycle ${c.c.n})</small><div class="bar"><i style="width:${p.length?100*c.c.seen.length/p.length:0}%"></i></div></td><td>${st?pct(st.c,st.a):'–'}</td></tr>`};
 const head='<tr><th>Group</th><th>Questions</th><th>Ever attempted</th><th>Current cycle</th><th>Accuracy</th></tr>';
 $('#app').innerHTML=`<h1>NICL Assistant Mains – Current Affairs & Insurance Awareness</h1><div class="sub">Practice from your uploaded June–September 2026 PDFs. Progress is saved in this browser (use Export Backup regularly).</div>
 <div class="card"><div class="grid">
 <div class="stat"><b>${all.length}</b><span>Unique questions in pool</span></div><div class="stat"><b>${O}</b><span>Original PDF questions</span></div><div class="stat"><b>${G}</b><span>Generated questions</span></div>
 <div class="stat"><b>${att}</b><span>Ever attempted</span></div><div class="stat"><b>${all.length-att}</b><span>Never attempted</span></div><div class="stat"><b>${pct(tot.c,tot.a)}</b><span>Overall accuracy (${tot.c}/${tot.a})</span></div>
 <div class="stat"><b>${pct(cy.c.seen.length,all.length)}</b><span>Cycle ${cy.c.n} completion (all questions)</span></div><div class="stat"><b>${S.wrong.filter(id=>BY[id]&&!BY[id].ex).length}</b><span>In "incorrect" list</span></div></div></div>
 <div class="card"><h2>Practice</h2><div class="btns">
 <button class="p" onclick="qs({sec:'all',m:'all',org:'all'})">Start Random Quiz</button>
 <button onclick="qs({sec:'CA'})">Practice Current Affairs</button><button onclick="qs({sec:'INS'})">Practice Insurance Awareness</button>
 <button onclick="qs({sec:'BANK'})">Practice Banking & Financial Awareness</button><button onclick="qs({sec:'MIX'})">Mixed Practice (CA + Insurance)</button>
 <button onclick="qs({org:'O'})">Practice Original PDF Questions</button><button onclick="qs({org:'G'})">Practice Generated Questions</button>
 <button onclick="qs(null,'incorrect')">Practice Incorrect Questions</button><button onclick="qs(null,'unattempted')">Practice Unattempted Questions</button>
 <button onclick="monthPick()">Month-wise Revision</button><button class="p" id="resb" onclick="resume()" ${S.active?'':'disabled title="No session in progress"'}>Resume Practice${S.active?' ('+(S.active.i)+'/'+S.active.qids.length+')':''}</button>
 <button onclick="history_()">Review Previous Results</button></div>
 <h2 style="margin-top:16px">Current selection</h2><div class="row"><select id="fs" onchange="setF()">${opt(SEC,f.sec)}</select><select id="fm" onchange="setF()">${opt(MON,f.m)}</select><select id="fo" onchange="setF()">${opt(ORG,f.org)}</select></div>
 <div class="sub" style="margin-top:6px">Quick buttons change the selection above. Each distinct selection keeps its own no-repeat cycle.</div>
 <div class="btns"><button onclick="qs()">Start Practice with this selection</button><button onclick="newCycle()">Start New Cycle (this selection)</button></div></div>
 <div class="card"><h2>Progress by section</h2><table>${head}${prog('All questions',{sec:'all',m:'all',org:'all'},tot)}${['CA','INS','BANK'].map(s=>prog(SEC[s],{sec:s,m:'all',org:'all'},S.st.sec[s])).join('')}${prog(SEC.MIX,{sec:'MIX',m:'all',org:'all'},null)}</table></div>
 <div class="card"><h2>Progress by month</h2><table>${head}${['Jun','Jul','Aug','Sep'].map(m=>prog(MON[m],{sec:'all',m,org:'all'},S.st.m[m])).join('')}</table></div>
 <div class="card"><h2>Original vs generated</h2><table>${head}${prog(ORG.O,{sec:'all',m:'all',org:'O'},S.st.org.O)}${prog(ORG.G,{sec:'all',m:'all',org:'G'},S.st.org.G)}</table></div>
 <div class="card"><h2>Backup & data</h2><div class="btns"><button onclick="exp()">Export Backup (JSON)</button><button onclick="$('#imp').click()">Import / Restore Backup</button><button class="d" onclick="wipe()">Delete All Progress</button></div><input type="file" id="imp" class="hide" accept=".json,application/json" onchange="imp(this)">
 <div class="sub" style="margin-top:8px">Question bank: ${BANK.length} records (${BANK.filter(q=>q.ex).length} excluded duplicates/unanswerable). Built ${esc(META.built)}. Answers are exactly as printed in your PDFs; no external verification was performed.</div></div>`}
function setF(){S.filt={sec:$('#fs').value,m:$('#fm').value,org:$('#fo').value};save()}
/* ---------- starting sessions ---------- */
function qs(patch,mode){if(patch&&patch.sec==='all'&&patch.m==='all')S.filt={sec:'all',m:'all',org:'all'};else if(patch)S.filt=Object.assign({},S.filt,patch);save();startModal(S.filt,mode||'normal')}
function monthPick(){modal('<h2>Month-wise Revision</h2><div class="btns">'+['Jun','Jul','Aug','Sep'].map(m=>{const c=cycle(Object.assign({},S.filt,{m}));return`<button onclick="S.filt.m='${m}';save();closeM();startModal(S.filt,'normal')">${MON[m]}<br><small>${c.rem.length} of ${c.ids.length} left</small></button>`}).join('')+'</div><div class="row" style="margin-top:10px"><span class="sp"></span><button onclick="closeM()">Cancel</button></div>')}
function startModal(f,mode){
 const p=pool(f),cy=cycle(f);save();let rem=cy.rem;
 if(mode==='unattempted')rem=rem.filter(x=>!S.att[x]);
 if(mode==='incorrect')rem=shuffle(p.map(q=>q.id).filter(x=>S.wrong.includes(x)));
 const mt={normal:'Normal (no-repeat cycle)',unattempted:'Unattempted questions only',incorrect:'Incorrect questions (separate from the cycle)'}[mode];
 if(!p.length){note('No questions match this selection.');return}
 if(!rem.length){
  if(mode==='incorrect')note('No incorrect questions in this selection. Nice work!');
  else if(mode==='unattempted')note('Every question in this selection has already been attempted at least once, or has been used in the current cycle.');
  else modal(`<h2>Cycle complete 🎉</h2><p>You have attempted all ${p.length} questions in <b>${esc(label(f))}</b> (cycle ${cy.c.n}). Nothing resets automatically.</p><div class="row"><span class="sp"></span><button onclick="closeM()">Close</button><button class="p" onclick="closeM();doNew('${key(f)}')">Start new cycle (fresh random order)</button></div>`);return}
 const lens=[10,20,25,50].filter(n=>n<rem.length);
 modal(`<h2>${esc(label(f))}</h2><p class="sub">${mt}<br>${p.length} questions in pool · ${rem.length} available now${mode==='normal'?` · cycle ${cy.c.n}`:''}</p><p>How many questions?</p><div class="btns">${lens.map(n=>`<button onclick="go('${mode}',${n})">${n} questions</button>`).join('')}<button class="p" onclick="go('${mode}',0)">All remaining (${rem.length})</button></div>${lens.length?'':'<p class="sub">Fewer than 10 remain, so all of them will be asked.</p>'}<div class="row" style="margin-top:10px"><span class="sp"></span><button onclick="closeM()">Cancel</button></div>`)}
function go(mode,n){closeM();const f=Object.assign({},S.filt),cy=cycle(f);let list=cy.rem;
 if(mode==='unattempted')list=list.filter(x=>!S.att[x]);if(mode==='incorrect')list=shuffle(pool(f).map(q=>q.id).filter(x=>S.wrong.includes(x)));
 const qids=n&&n<list.length?list.slice(0,n):list;if(!qids.length)return;
 S.active={mode,f,key:key(f),qids,i:0,ans:{},perm:{},t0:Date.now()};save();quiz()}
function resume(){if(S.active)quiz()}
function doNew(k){const c=S.cyc[k];if(c){c.n++;c.seen=[];c.order=[]}save();dash()}
function newCycle(){const f=S.filt,c=cycle(f);ask(`Start a new cycle for <b>${esc(label(f))}</b>?<br>This clears which questions count as “seen” in cycle ${c.c.n} (${c.c.seen.length} of ${c.ids.length}) and re-randomises the order. Your answer history, accuracy and incorrect list are kept.`,'Start new cycle',()=>doNew(key(f)))}
/* ---------- quiz ---------- */
function permFor(q,A){if(!A.perm[q.id])A.perm[q.id]=q.ns?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i));return A.perm[q.id]}
function quiz(sel){const A=S.active;if(!A){dash();return}if(A.i>=A.qids.length){finish();return}
 const q=BY[A.qids[A.i]],pm=permFor(q,A),done=A.ans[q.id];sel=sel===undefined?(done?pm.indexOf(done.sel):-1):sel;
 const tags=`<span class="tag">${SEC[q.sec]}</span><span class="tag">${esc(q.sub)}</span><span class="tag">${MON[q.m]}</span><span class="tag">${q.org==='O'?'Original PDF Question':'Generated Question'}</span>`+(q.fl.some(x=>!x.startsWith('auto'))?'<span class="tag w">Verify answer</span>':'')+(q.org==='G'?'<span class="tag w">Auto-generated</span>':'');
 let h=`<div class="row"><b>Question ${A.i+1} / ${A.qids.length}</b><span class="sp"></span><button onclick="dash()">Save & exit</button><button onclick="ask('End this session now? Unanswered questions will not count as attempted.','End session',finish)">End session</button></div><div class="card"><div>${tags}</div><div class="q">${esc(q.t)}</div>`;
 pm.forEach((oi,k)=>{let c='opt';if(done){if(oi===q.a)c+=' ok';else if(oi===done.sel)c+=' no'}else if(sel===k)c+=' sel';h+=`<button class="${c}" ${done?'disabled':''} onclick="quiz(${k})"><b>${L[k]}.</b> ${esc(q.o[oi])}</button>`});
 if(!done)h+=`<div class="row" style="margin-top:8px"><button class="p" ${sel<0?'disabled':''} onclick="submit(${sel})">Submit</button></div>`;
 else{const ca=L[pm.indexOf(q.a)];h+=`<div class="fb ${done.ok?'ok':'no'}"><b>${done.ok?'Correct ✔':'Incorrect ✘'}</b> — correct answer: ${ca}. ${esc(q.o[q.a])}${done.ok?'':`<br>You chose ${L[pm.indexOf(done.sel)]}. ${esc(q.o[done.sel])} — this is not what the source states.`}</div><div class="ex"><b>Explanation:</b> ${esc(expl(q))}<br><small>Source: ${esc(q.src)}${q.pg?', page '+q.pg:''}${q.es==='auto-note'?' · explanation matched automatically from the PDFs\' notes':''}${q.es==='answer-only'?' · no matching note found; answer as printed in source':''}${q.fl.length&&q.org==='O'?' · Flag: '+esc(q.fl.join('; ')):''}</small></div><div class="row" style="margin-top:10px"><button class="p" onclick="nextQ()">${A.i+1>=A.qids.length?'Finish & see results':'Next Question'}</button></div>`}
 $('#app').innerHTML=h+'</div>';window.scrollTo(0,0)}
function expl(q){return q.e||'No explanation available.'}
function submit(k){const A=S.active,q=BY[A.qids[A.i]],pm=permFor(q,A),oi=pm[k],ok=oi===q.a;if(A.ans[q.id])return;A.ans[q.id]={sel:oi,ok};
 const w=S.wrong.indexOf(q.id);if(ok&&w>-1)S.wrong.splice(w,1);if(!ok&&w<0)S.wrong.push(q.id);
 if(A.mode!=='incorrect'){const p=S.att[q.id]||{n:0};S.att[q.id]={ok,t:Date.now(),n:p.n+1};const c=S.cyc[A.key];if(c&&!c.seen.includes(q.id))c.seen.push(q.id);
  // also mark as seen in any other cycle whose pool contains it? No: cycles are independent by design.
  const bump=(o,k2)=>{const r=o[k2]||(o[k2]={a:0,c:0});r.a++;if(ok)r.c++};bump(S.st,'tot');bump(S.st.sec,q.sec);bump(S.st.m,q.m);bump(S.st.org,q.org)}
 save();quiz()}
function nextQ(){S.active.i++;save();quiz()}
function summary(items,lbl,when){const by={},sb={};let c=0;items.forEach(it=>{const q=BY[it.id];if(!q)return;if(it.ok)c++;const a=by[q.sec]||(by[q.sec]={a:0,c:0});a.a++;if(it.ok)a.c++;const b=sb[q.sub]||(sb[q.sub]={a:0,c:0});b.a++;if(it.ok)b.c++});
 const n=items.length,t=r=>Object.keys(r).map(k=>`<tr><td>${esc(SEC[k]||k)}</td><td>${r[k].c}/${r[k].a}</td><td>${pct(r[k].c,r[k].a)}</td></tr>`).join('');
 const wr=items.filter(it=>!it.ok&&BY[it.id]).map(it=>{const q=BY[it.id];return`<div class="rev"><div class="q" style="font-size:1rem">${esc(q.t)}</div><div>Your answer: ${esc(q.o[it.sel])}<br>Correct: <b>${esc(q.o[q.a])}</b></div><div class="ex">${esc(expl(q))}<br><small>${esc(q.src)}${q.pg?', p.'+q.pg:''}</small></div></div>`}).join('');
 return`<div class="card"><h2>${esc(lbl)}</h2><div class="sub">${esc(when)}</div><div class="grid"><div class="stat"><b>${n}</b><span>Attempted</span></div><div class="stat"><b>${c}</b><span>Correct</span></div><div class="stat"><b>${n-c}</b><span>Incorrect</span></div><div class="stat"><b>${pct(c,n)}</b><span>Accuracy</span></div></div>
 <h2 style="margin-top:14px">Section-wise</h2><table><tr><th>Section</th><th>Score</th><th>%</th></tr>${t(by)}</table><h2 style="margin-top:14px">Topic-wise</h2><table><tr><th>Topic</th><th>Score</th><th>%</th></tr>${t(sb)}</table></div>
 <div class="card"><h2>Incorrect answers (${n-c})</h2>${wr||'<p>None – perfect!</p>'}</div>`}
function finish(){closeM();const A=S.active;if(!A){dash();return}const items=Object.keys(A.ans).map(id=>({id,sel:A.ans[id].sel,ok:A.ans[id].ok}));
 const lbl=({normal:'Quiz',unattempted:'Unattempted practice',incorrect:'Incorrect-question practice'}[A.mode])+' – '+label(A.f);
 const rec={t:Date.now(),lbl,mode:A.mode,items};if(items.length){S.sess.unshift(rec);S.sess=S.sess.slice(0,300)}S.active=null;save();
 let rem='';if(A.mode!=='incorrect'){const c=cycle(A.f);rem=`<div class="card">Questions still remaining in this cycle (${esc(label(A.f))}): <b>${c.rem.length}</b> of ${c.ids.length}.</div>`}
 $('#app').innerHTML=`<div class="row"><button class="p" onclick="dash()">Back to dashboard</button></div>`+(items.length?summary(items,'Session results',new Date(rec.t).toLocaleString()):'<div class="card">No questions were answered in this session.</div>')+rem;window.scrollTo(0,0)}
function history_(){const h=S.sess;$('#app').innerHTML=`<div class="row"><button onclick="dash()">Back</button></div><div class="card"><h2>Previous results</h2>${h.length?'<table><tr><th>When</th><th>Session</th><th>Score</th></tr>'+h.map((s,i)=>{const c=s.items.filter(x=>x.ok).length;return`<tr style="cursor:pointer" onclick="oneSess(${i})"><td>${new Date(s.t).toLocaleString()}</td><td>${esc(s.lbl)}</td><td>${c}/${s.items.length} (${pct(c,s.items.length)})</td></tr>`}).join('')+'</table>':'<p>No completed sessions yet.</p>'}</div>`}
function oneSess(i){const s=S.sess[i];$('#app').innerHTML=`<div class="row"><button onclick="history_()">Back</button></div>`+summary(s.items,s.lbl,new Date(s.t).toLocaleString())}
/* ---------- backup ---------- */
function exp(){const b=new Blob([JSON.stringify({app:'niclQuiz',version:1,exported:new Date().toISOString(),state:S})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nicl-quiz-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}
function imp(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),st=j.state||j;if(!st||typeof st.att!=='object'||typeof st.cyc!=='object')throw 0;
 ask(`Restore this backup? It will <b>replace</b> the progress currently stored in this browser (${Object.keys(S.att).length} attempted questions) with the backup (${Object.keys(st.att).length}).`,'Restore',()=>{S=Object.assign(fresh(),st);save();dash()})}catch(e){note('That file is not a valid backup for this app.')}inp.value=''};r.readAsText(f)}
function wipe(){ask('Delete <b>all</b> progress, history and cycles stored in this browser? This cannot be undone (export a backup first if unsure).','Delete everything',()=>{S=fresh();save();dash()})}
dash();
</script></body></html>
